name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      - run: npm run build
        env:
          BASE_PATH: /widgets

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build/
